<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request a Match - Rally</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="homepage.html">
      <span class="brand-ball" aria-hidden="true"></span>
      Rally
    </a>

    <div class="app-header-right">
      <span class="app-user" id="header-user"></span>
      <form action="/signout" method="post">
        <button type="submit" class="btn btn-small btn-outline-light">Sign out</button>
      </form>
    </div>
  </header>

  <nav class="app-nav" aria-label="Main">
    <a href="homepage.html">Home</a>
    <a href="requests.html">Match requests</a>
    <a href="newrequest.html" aria-current="page">Request a match</a>
    <a href="profile.html">My profile</a>
  </nav>

  <main class="app-main">
    <div class="app-intro">
      <h1>Request a match</h1>
      <p>Pick a day and time. Other players will see it on their Match requests page.</p>
    </div>

    <p class="notice" id="notice" hidden></p>

    <div class="card card-narrow">
      <form id="request-form">
        <div class="form-row">
          <div class="form-group">
            <label for="request-date">Date</label>
            <input type="date" id="request-date" name="date" required>
          </div>

          <div class="form-group">
            <label for="request-time">Time</label>
            <input type="time" id="request-time" name="time" required>
          </div>
        </div>

        <button type="submit" class="btn btn-accent">Post request</button>
      </form>
    </div>
  </main>

  <script src="scripts/common.js"></script>
  <script src="scripts/newrequest.js"></script>
</body>
</html>
