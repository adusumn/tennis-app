<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Rally</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-hero">
      <div class="court" aria-hidden="true">
        <div class="court-singles"></div>
        <div class="court-service"></div>
        <div class="court-center"></div>
        <div class="court-mark court-mark-top"></div>
        <div class="court-mark court-mark-bottom"></div>
        <div class="court-net"></div>
      </div>

      <a class="brand" href="homepage.html">
        <span class="brand-ball" aria-hidden="true"></span>
        Rally
      </a>

      <p class="hero-footer">&copy; 2026 Rally</p>
    </section>

    <section class="auth-panel">
      <div class="hero-copy">
        <h1>Welcome back to the court.</h1>
        <p>Sign in to find players at your level, track your rating, and set up your next match.</p>
      </div>

      <div class="auth-card">
        <h2>Sign in</h2>
        <p class="subtitle">Enter your details to continue.</p>

        <form action="/signin" method="post">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="email" id="username" name="username" placeholder="yourname@rose-hulman.edu" autocomplete="username" pattern="[A-Za-z0-9._%+\-]+@rose-hulman\.edu" title="Must be a rose-hulman.edu email address" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" maxlength="12" required>
          </div>

          <div class="form-options">
            <label class="checkbox">
              <input type="checkbox" name="remember">
              Remember me
            </label>
            <a class="link" href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn">Sign in</button>
        </form>

        <p class="switch-auth">
          New here? <a class="link" href="signup.html">Create an account</a>
        </p>
      </div>
    </section>
  </main>
</body>
</html>
